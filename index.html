<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>麻雀ガチャ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="flashEffect" class="flash-effect"></div>

    <main class="container">
        <h1>🀄 麻雀ガチャ</h1>

        <section class="result-area">
            <p class="result-label">ガチャ結果</p>

            <div id="singleGachaResult">
                <div id="tile" class="tile">？</div>

                <p id="tileName" class="tile-name">
                    ガチャを引いてください
                </p>

                <p id="rarity" class="rarity rarity-n">
                    N
                </p>
            </div>

            <div
                id="tenGachaResult"
                class="ten-gacha-result"
            ></div>

            <!-- ここから追加 -->
        <div
            id="yakumanResult"
            class="yakuman-result"
        >
            <p class="yakuman-result-label">役満</p>

            <h2
                id="yakumanName"
                class="yakuman-result-name"
            >
                国士無双
            </h2>

            <div
                id="yakumanTiles"
                class="yakuman-result-tiles"
            ></div>

            <p class="yakuman-result-get">
                LEGEND GET!
            </p>
        </div>
        </section>

        <button id="gachaButton" class="gacha-button">
            ガチャを引く
        </button>

        <button id="tenGachaButton" class="ten-gacha-button">
            ✨ 10連ガチャ ✨
        </button>


        <p class="count-text">
            ガチャ回数：
            <span id="gachaCount">0</span>
            回
        </p>

        <section class="history-area">
            <h2>最近出た牌</h2>

            <ul id="historyList" class="history-list">
            </ul>
        </section>

        <section class="collection-area">
            <div class="collection-tabs">
                <button
                    id="tileCollectionTab"
                    class="collection-tab active"
                    type="button"
                >
                    牌図鑑
                </button>

                <button
                    id="yakumanCollectionTab"
                    class="collection-tab"
                    type="button"
                >
                    役図鑑
                </button>
            </div>

            <p id="collectionCount" class="collection-count">
                収集数：0 / 34
            </p>

            <div id="tileCollectionPanel" class="collection-panel active">
                <div id="collection" class="collection-list"></div>
            </div>

            <div id="yakumanCollectionPanel" class="collection-panel">
                <div id="yakumanCollection" class="yakuman-collection"></div>
            </div>
        </section>

        
    </main>

    <!-- 牌の詳細ポップアップ -->
    <div id="tileModal" class="tile-modal">
        <div class="tile-modal-content">
            <button id="closeModalButton" class="modal-close-button">
                ×
            </button>

            <h2 id="modalTileName" class="modal-title">
                六萬
            </h2>

            <p class="modal-description">取得済みレア度</p>

            <div id="modalRarityList" class="modal-rarity-list">
            </div>
        </div>
    </div>

    <!-- 役図鑑の詳細ポップアップ -->
    <div id="yakumanDetailModal" class="tile-modal">
        <div class="yakuman-detail-content">
            <button
                id="closeYakumanDetailButton"
                class="modal-close-button"
            >
                ×
            </button>

            <h2
                id="yakumanDetailName"
                class="modal-title"
            >
                国士無双
            </h2>

            <div
                id="yakumanDetailTiles"
                class="yakuman-detail-tiles"
            ></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
