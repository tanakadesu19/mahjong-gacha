<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>麻雀ガチャ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>🀄 麻雀ガチャ</h1>

        <section class="result-area">
            <p class="result-label">ガチャ結果</p>

            <div id="tile" class="tile">？</div>

            <p id="tileName" class="tile-name">
                ガチャを引いてください
            </p>

            <p id="rarity" class="rarity rarity-n">N</p>
        </section>

        <button id="gachaButton" class="gacha-button">
            ガチャを引く
        </button>

        <p class="count-text">
            ガチャ回数：
            <span id="gachaCount">0</span>
            回
        </p>

        <section class="history-area">
            <h2>最近出た牌</h2>

            <ul id="historyList" class="history-list">
            </ul>
        </section>

        <section class="collection-area">
            <h2>牌図鑑</h2>

            <p class="collection-count">
                収集数：
                <span id="collectionCount">0</span>
                / 34
            </p>

            <div id="collectionList" class="collection-list"></div>
        </section>

        
    </main>

    <!-- 牌の詳細ポップアップ -->
    <div id="tileModal" class="tile-modal">
        <div class="tile-modal-content">
            <button id="closeModalButton" class="modal-close-button">
                ×
            </button>

            <h2 id="modalTileName" class="modal-title">
                六萬
            </h2>

            <p class="modal-description">取得済みレア度</p>

            <div id="modalRarityList" class="modal-rarity-list">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
